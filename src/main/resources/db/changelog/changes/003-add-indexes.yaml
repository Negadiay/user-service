databaseChangeLog:
  - changeSet:
      id: 003-add-indexes
      author: negadiay
      changes:
        - createIndex:
            tableName: payment_cards
            indexName: idx_payment_cards_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: users
            indexName: idx_users_name
            columns:
              - column:
                  name: name
        - createIndex:
            tableName: users
            indexName: idx_users_surname
            columns:
              - column:
                  name: surname